name: Release J12 Forensic

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Universal macOS .dmg and .app (Apple Silicon + Intel)
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest' # Windows .msi and .exe
            args: ''
          - platform: 'ubuntu-22.04' # Linux .AppImage and .deb
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libsoup-3.0-dev javascriptcoregtk-4.1

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri Application & Upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'J12 Forensic Suite ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            ## J12 Forensic Suite Release ${{ github.event.inputs.version || github.ref_name }}
            
            ### Automated Binary Assets:
            - **macOS Universal (.dmg / .app)**: Native support for both Apple Silicon (M1/M2/M3/M4) and Intel Macs.
            - **Windows (.msi / .exe)**: Complete Windows installer with desktop and start menu shortcuts.
            - **Linux (.AppImage / .deb)**: Standalone portable AppImage and Debian installation package.
            
            ### Integrity & Verification:
            Cryptographic SHA-256 signatures are included with each downloadable artifact.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
