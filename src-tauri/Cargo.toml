[package]
name = "email-forensic"
version = "0.1.0"
description = "Email Forensic Investigation Platform"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
md5 = "0.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
regex = "1"
base64 = "0.22"
rfd = "0.14"

[dev-dependencies]
tempfile = "3"
