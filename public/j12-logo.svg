<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="120" rx="16" fill="#0b0f17"/>
  <rect x="0.5" y="0.5" width="399" height="119" rx="15.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Icon Emblem -->
  <g transform="translate(24, 20)">
    <!-- Glow -->
    <rect x="-4" y="-4" width="88" height="88" rx="20" fill="url(#glowGrad)"/>
    <!-- Badge -->
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#shieldGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Forensic Magnifier / Shield Overlay -->
    <circle cx="36" cy="36" r="20" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="80 20"/>
    <line x1="50" y1="50" x2="64" y2="64" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Core Lock / Node -->
    <circle cx="36" cy="36" r="6" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(124, 62)">
    <!-- J in White, 12 in Green -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      <tspan fill="#ffffff">J</tspan><tspan fill="#22c55e" filter="url(#neon)">12</tspan>
    </text>
    <!-- Subtitle -->
    <text x="3" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="2.5">
      EMAIL FORENSIC SUITE
    </text>
    <text x="3" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="9" font-weight="500" fill="#64748b" letter-spacing="0.5">
      COURT-ADMISSIBLE EVIDENCE &amp; PROVENANCE
    </text>
  </g>
</svg>
