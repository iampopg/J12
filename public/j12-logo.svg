<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="thumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="120" rx="16" fill="#0b0f17"/>
  <rect x="0.5" y="0.5" width="399" height="119" rx="15.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Icon Emblem -->
  <g transform="translate(24, 20)">
    <!-- Glow -->
    <rect x="-4" y="-4" width="88" height="88" rx="20" fill="url(#glowGrad)"/>
    <!-- Badge -->
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#shieldGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Biometric Thumbprint / Fingerprint Forensic Background Arcs -->
    <g stroke="url(#thumbGrad)" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M 28 20 C 34 14, 46 14, 52 20 C 58 26, 58 38, 53 45 C 49 50, 42 55, 38 59"/>
      <path d="M 23 25 C 31 16, 49 16, 57 25 C 63 32, 63 45, 57 53 C 52 59, 43 65, 38 67"/>
      <path d="M 18 32 C 27 19, 53 19, 62 32 C 67 39, 66 52, 60 60 C 54 67, 44 72, 38 74"/>
      <path d="M 33 26 C 37 22, 43 22, 47 26 C 50 29, 50 36, 47 40 C 44 43, 39 47, 37 51"/>
      <path d="M 38 32 A 4 4 0 0 1 42 36 C 42 40, 39 42, 37 45"/>
      <path d="M 14 40 C 22 24, 58 24, 66 40 C 71 48, 69 62, 62 69"/>
    </g>

    <!-- Forensic Magnifier / Security Reticle Overlay -->
    <circle cx="40" cy="40" r="22" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="80 20" opacity="0.8"/>
    <line x1="55" y1="55" x2="68" y2="68" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Core Security Lock Dot -->
    <circle cx="40" cy="40" r="5" fill="#ffffff" filter="url(#neon)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(124, 62)">
    <!-- J in White, 12 in Green -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      <tspan fill="#ffffff">J</tspan><tspan fill="#22c55e" filter="url(#neon)">12</tspan>
    </text>
    <!-- Subtitle -->
    <text x="3" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="2.5">
      EMAIL FORENSIC SUITE
    </text>
    <text x="3" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="9" font-weight="500" fill="#64748b" letter-spacing="0.5">
      COURT-ADMISSIBLE EVIDENCE &amp; PROVENANCE
    </text>
  </g>
</svg>
