  <text x="155" y="449" font-family="system-ui" font-size="9" fill="#94a3b8" text-anchor="middle">SPOOFING</text>

  <text x="200" y="449" font-family="system-ui" font-size="12" fill="#e2e8f0">Reply-To domain differs from From domain</text>

  <rect x="550" y="436" width="50" height="18" rx="9" fill="rgba(234,179,8,0.15)"/>
  <text x="575" y="449" font-family="system-ui" font-size="9" fill="#fde047" text-anchor="middle">REVIEWED</text>

  <text x="620" y="449" font-family="monospace" font-size="11" fill="#94a3b8">2</text>

  <rect x="700" y="434" width="24" height="22" rx="4" fill="#252d3d"/>
  <text x="712" y="449" font-family="system-ui" font-size="12" fill="#4ade80" text-anchor="middle">✓</text>
  <rect x="728" y="434" width="24" height="22" rx="4" fill="#252d3d"/>
  <text x="740" y="449" font-family="system-ui" font-size="12" fill="#f87171" text-anchor="middle">✗</text>

