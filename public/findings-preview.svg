  <text x="620" y="485" font-family="monospace" font-size="11" fill="#94a3b8">1</text>

  <rect x="700" y="470" width="24" height="22" rx="4" fill="#252d3d"/>
  <text x="712" y="485" font-family="system-ui" font-size="12" fill="#4ade80" text-anchor="middle">✓</text>
