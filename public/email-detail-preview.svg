<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0a0d12"/>

  <!-- Card -->
  <rect x="20" y="20" width="760" height="560" rx="8" fill="#151a23" stroke="#2a3344" stroke-width="1"/>

  <!-- Header -->
  <rect x="20" y="20" width="760" height="60" rx="8" fill="#1c2230"/>
  <rect x="20" y="60" width="760" height="20" fill="#1c2230"/>
  <line x1="20" y1="80" x2="780" y2="80" stroke="#2a3344" stroke-width="1"/>

  <!-- Subject -->
  <text x="40" y="48" font-family="system-ui" font-size="16" font-weight="600" fill="#f8fafc">Urgent wire transfer needed</text>
  <text x="40" y="68" font-family="system-ui" font-size="12" fill="#64748b">From: john.smith@enron.com · Mon, 15 Jan 2001 09:15</text>

  <!-- Close button -->
  <rect x="720" y="30" width="50" height="28" rx="6" fill="#252d3d"/>
  <text x="745" y="49" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Close</text>

  <!-- Tabs -->
  <rect x="40" y="90" width="720" height="36" fill="transparent"/>
  
  <!-- Overview Tab (inactive) -->
  <rect x="40" y="92" width="70" height="32" rx="6" fill="transparent"/>
  <text x="75" y="113" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">Overview</text>

  <!-- Headers Tab (inactive) -->
  <rect x="115" y="92" width="70" height="32" rx="6" fill="transparent"/>
  <text x="150" y="113" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">Headers</text>

  <!-- Authentication Tab (active) -->
  <rect x="190" y="92" width="100" height="32" rx="6" fill="#3b82f6"/>
  <text x="240" y="113" font-family="system-ui" font-size="12" fill="#fff" text-anchor="middle">Authentication</text>

  <!-- MIME Tab (inactive) -->
  <rect x="295" y="92" width="55" height="32" rx="6" fill="transparent"/>
  <text x="322" y="113" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">MIME</text>

  <!-- Raw Tab (inactive) -->
  <rect x="355" y="92" width="45" height="32" rx="6" fill="transparent"/>
  <text x="377" y="113" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">Raw</text>

  <!-- Attachments Tab (inactive) -->
  <rect x="405" y="92" width="90" height="32" rx="6" fill="transparent"/>
  <text x="450" y="113" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">Attachments</text>

  <!-- Content Area -->
  <!-- SPF Result -->
  <rect x="40" y="140" width="350" height="80" rx="8" fill="#1c2230"/>
  <text x="56" y="162" font-family="system-ui" font-size="14" font-weight="600" fill="#f8fafc">SPF</text>
  <rect x="310" y="148" width="60" height="24" rx="12" fill="rgba(34,197,94,0.15)"/>
  <text x="340" y="165" font-family="system-ui" font-size="11" fill="#4ade80" text-anchor="middle">PASS</text>
  <text x="56" y="185" font-family="system-ui" font-size="11" fill="#64748b">SPF validation passed — sender authorized</text>
  <text x="56" y="205" font-family="monospace" font-size="11" fill="#94a3b8">Domain: enron.com · Aligned: Yes</text>

  <!-- DKIM Result -->
  <rect x="410" y="140" width="350" height="80" rx="8" fill="#1c2230"/>
  <text x="426" y="162" font-family="system-ui" font-size="14" font-weight="600" fill="#f8fafc">DKIM</text>
  <rect x="700" y="148" width="60" height="24" rx="12" fill="rgba(34,197,94,0.15)"/>
  <text x="730" y="165" font-family="system-ui" font-size="11" fill="#4ade80" text-anchor="middle">PASS</text>
  <text x="426" y="185" font-family="system-ui" font-size="11" fill="#64748b">DKIM signature verified</text>
  <text x="426" y="205" font-family="monospace" font-size="11" fill="#94a3b8">Selector: default · Domain: enron.com</text>

  <!-- DMARC Result -->
  <rect x="40" y="235" width="350" height="80" rx="8" fill="#1c2230"/>
  <text x="56" y="257" font-family="system-ui" font-size="14" font-weight="600" fill="#f8fafc">DMARC</text>
  <rect x="310" y="243" width="60" height="24" rx="12" fill="rgba(34,197,94,0.15)"/>
  <text x="340" y="260" font-family="system-ui" font-size="11" fill="#4ade80" text-anchor="middle">PASS</text>
  <text x="56" y="280" font-family="system-ui" font-size="11" fill="#64748b">DMARC policy: reject — both checks passed</text>
  <text x="56" y="300" font-family="monospace" font-size="11" fill="#94a3b8">Alignment: ALIGNED</text>

  <!-- ARC Result -->
  <rect x="410" y="235" width="350" height="80" rx="8" fill="#1c2230"/>
  <text x="426" y="257" font-family="system-ui" font-size="14" font-weight="600" fill="#f8fafc">ARC</text>
  <rect x="700" y="243" width="60" height="24" rx="12" fill="#252d3d"/>
  <text x="730" y="260" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">N/A</text>
  <text x="426" y="280" font-family="system-ui" font-size="11" fill="#64748b">No ARC seals present in headers</text>
  <text x="426" y="300" font-family="monospace" font-size="11" fill="#64748b">Not forwarded through ARC-enabled intermediary</text>

  <!-- Received Chain -->
  <text x="40" y="345" font-family="system-ui" font-size="13" font-weight="600" fill="#f8fafc">Received Chain (3 hops, bottom = oldest)</text>

  <!-- Hop 1 (oldest) -->
  <rect x="40" y="355" width="720" height="40" rx="4" fill="#1c2230"/>
  <text x="56" y="372" font-family="system-ui" font-size="11" fill="#94a3b8">Hop 1 (oldest)</text>
  <text x="56" y="387" font-family="monospace" font-size="10" fill="#64748b">from mail.enron.com by proxy.corp.com with ESMTP</text>
  <rect x="680" y="363" width="60" height="20" rx="10" fill="rgba(34,197,94,0.1)"/>
  <text x="710" y="377" font-family="system-ui" font-size="10" fill="#4ade80" text-anchor="middle">+0.1s</text>

  <!-- Hop 2 -->
  <rect x="40" y="400" width="720" height="40" rx="4" fill="#1c2230"/>
  <text x="56" y="417" font-family="system-ui" font-size="11" fill="#94a3b8">Hop 2</text>
  <text x="56" y="432" font-family="monospace" font-size="10" fill="#64748b">from proxy.corp.com by mail.gateway.com with HTTP</text>
  <rect x="680" y="408" width="60" height="20" rx="10" fill="rgba(34,197,94,0.1)"/>
  <text x="710" y="422" font-family="system-ui" font-size="10" fill="#4ade80" text-anchor="middle">+2.3s</text>

  <!-- Hop 3 (newest) -->
  <rect x="40" y="445" width="720" height="40" rx="4" fill="#1c2230"/>
  <text x="56" y="462" font-family="system-ui" font-size="11" fill="#94a3b8">Hop 3 (newest)</text>
  <text x="56" y="477" font-family="monospace" font-size="10" fill="#64748b">from [192.168.1.100] by inet.gateway.com with SMTP id abc123</text>
  <rect x="680" y="453" width="60" height="20" rx="10" fill="rgba(34,197,94,0.1)"/>
  <text x="710" y="467" font-family="system-ui" font-size="10" fill="#4ade80" text-anchor="middle">+0.5s</text>

  <!-- Analysis Summary -->
  <rect x="40" y="500" width="720" height="70" rx="8" fill="#1c2230"/>
  <text x="56" y="520" font-family="system-ui" font-size="12" font-weight="600" fill="#f8fafc">Analysis Summary</text>
  
  <rect x="56" y="530" width="100" height="30" rx="4" fill="#252d3d"/>
  <text x="106" y="550" font-family="system-ui" font-size="11" fill="#4ade80" text-anchor="middle">No Anomalies</text>

  <rect x="166" y="530" width="120" height="30" rx="4" fill="#252d3d"/>
  <text x="226" y="550" font-family="system-ui" font-size="11" fill="#4ade80" text-anchor="middle">No Clock Skew</text>

  <rect x="296" y="530" width="140" height="30" rx="4" fill="#252d3d"/>
  <text x="366" y="550" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Originating: 192.168.1.100</text>
</svg>